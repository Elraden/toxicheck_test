services:
  - type: web
    name: toxicheck-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    preDeployCommand: python -m app.db.apply_schema
    envVars:
      - key: APP_NAME
        value: ToxiCheck API
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://toxicheck-ruby.vercel.app
      - key: OPEN_FOOD_FACTS_BASE_URL
        value: https://world.openfoodfacts.org
      - key: OCR_MODE
        value: embedded
      - key: OCR_SERVICE_URL
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: toxicheck-postgres
          property: connectionString

databases:
  - name: toxicheck-postgres
    databaseName: toxicheck
    user: toxicheck
    plan: free
