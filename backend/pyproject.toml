[project]
name = "toxicheck-backend"
version = "0.1.0"
description = "Ingredient recognition and risk rules API for ToxiCheck."
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0",
  "httpx>=0.27.2",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
ocr = [
  "numpy>=2.0.0",
  "opencv-python-headless>=4.10.0.84",
  "Pillow>=10.4.0",
  "pytesseract>=0.3.13",
  "python-Levenshtein>=0.26.0"
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
