services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: toxicheck
      POSTGRES_USER: toxicheck
      POSTGRES_PASSWORD: toxicheck
    ports:
      - "127.0.0.1:${TOXICHECK_POSTGRES_PORT:-5433}:5432"
    volumes:
      - toxicheck_postgres:/var/lib/postgresql/data
      - ./backend/db/schema_catalog.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./backend/db/migrations/20261029_identity.sql:/docker-entrypoint-initdb.d/002-identity.sql:ro
      - ./backend/db/migrations/20261030_research.sql:/docker-entrypoint-initdb.d/003-research.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toxicheck -d toxicheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: ToxiCheck API
      APP_ENV: local
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://toxicheck:toxicheck@postgres:5432/toxicheck
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OPEN_FOOD_FACTS_BASE_URL: https://world.openfoodfacts.org
      OCR_MODE: embedded
      OCR_SERVICE_URL:
      RESEARCH_STORAGE_DIR: /data/research-photos
    volumes:
      - toxicheck_research_photos:/data/research-photos
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  toxicheck_postgres:
  toxicheck_research_photos:
